spring:
  application:
    name: order-system-service

  datasource:
    url: jdbc:mysql://localhost:3306/order_management
    username: order_user
    password: order_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8081
logging:
  level:
    root: INFO
    com.taher: DEBUG
